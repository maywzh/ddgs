services:
  ddgs-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DDGS_PROXY
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    # MCP SDK v2 server speaks both 2025-11-25 and 2026-07-28 protocol revisions,
    # so an `initialize` POST works as a health probe regardless of which era the
    # next client will negotiate. The 2026 path skips Mcp-Session-Id entirely,
    # which makes the server trivially scalable behind any round-robin LB.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "http://localhost:8000/mcp", "-H", "Content-Type: application/json", "-H", "Accept: application/json, text/event-stream", "-d", '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0.0"}}}']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # To run REST API instead, override command:
    # command: ["python", "-m", "uvicorn", "ddgs.api_server:fastapi_app", "--host", "0.0.0.0", "--port", "8000"]
